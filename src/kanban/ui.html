<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jarvis kanban</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; background: #0b0f17; color: #e2e8f0; }
  header { padding: 14px 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .board { flex: 1 1 auto; min-height: 0; display: flex; gap: 16px; padding: 30px; overflow-x: auto; align-items: stretch; }
  .col { flex: 0 0 300px; min-height: 0; display: flex; flex-direction: column; background: #0f1626; border: 1px solid #1e293b; border-radius: 10px; }
  .col.parking { background: #0c111c; }
  .col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: #94a3b8; margin: 0; padding: 12px 14px 8px; display: flex; justify-content: space-between; flex: 0 0 auto; }
  .col.drop { outline: 2px dashed #3b82f6; outline-offset: -4px; }
  .cards { flex: 1 1 auto; min-height: 40px; overflow-y: auto; padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #172033; border: 1px solid #263450; border-radius: 8px; padding: 10px; cursor: grab; }
  .card:active { cursor: grabbing; }
  .card.selected { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
  .card .name { font-weight: 500; margin-bottom: 4px; }
  .card .meta { font-size: 11px; color: #64748b; margin-bottom: 8px; }
  .card .row { display: flex; align-items: center; justify-content: space-between; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .open { background: none; border: 1px solid #334155; color: #94a3b8; border-radius: 6px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
  .open:hover { border-color: #475569; color: #cbd5e1; }
  .add { width: 100%; background: none; border: 1px dashed #334155; color: #64748b; border-radius: 6px; padding: 8px; cursor: pointer; font-size: 12px; }
  .add:hover { border-color: #3b82f6; color: #93c5fd; }
</style>
</head>
<body>
<header>
  <h1>jarvis <span style="color:#3b82f6">kanban</span></h1>
</header>
<div class="board" id="board"></div>

<script>
let BOARD = { columns: [], statuses: {} };
const cards = new Map();
let selectedId = null;

async function boot() {
  BOARD = await (await fetch('/api/board')).json();
  const state = await (await fetch('/api/state')).json();
  for (const c of state.cards) cards.set(c.id, c);
  render();
  listen();

  // seleção + Del: clicar no card seleciona; Del pede confirmação e apaga.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Delete' && selectedId) {
      const c = cards.get(selectedId);
      if (c && confirm(`Apagar o card "${c.name}"? As sessões dele serão encerradas.`)) del(selectedId);
    }
  });
  document.getElementById('board').addEventListener('click', (e) => {
    if (e.target.id === 'board') { selectedId = null; render(); } // clique no vazio deseleciona
  });
}

function listen() {
  const es = new EventSource('/events');
  es.addEventListener('state', (e) => { for (const c of JSON.parse(e.data).cards) cards.set(c.id, c); render(); });
  es.addEventListener('card', (e) => { const c = JSON.parse(e.data); cards.set(c.id, c); render(); });
  es.addEventListener('status', (e) => { const { id, status } = JSON.parse(e.data); const c = cards.get(id); if (c) { c.status = status; render(); } });
  es.addEventListener('exit', (e) => { const c = cards.get(JSON.parse(e.data).id); if (c) { c.status = 'idle'; render(); } });
  es.addEventListener('delete', (e) => { const { id } = JSON.parse(e.data); cards.delete(id); if (selectedId === id) selectedId = null; render(); });
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (const col of BOARD.columns) {
    const el = document.createElement('div');
    el.className = 'col' + (col.type === 'parking' ? ' parking' : '');
    el.dataset.col = col.id;
    el.innerHTML = `<h2>${col.title}<span>${col.skill || ''}</span></h2><div class="cards"></div>`;
    const list = el.querySelector('.cards');

    for (const c of cards.values()) {
      if (c.column !== col.id) continue;
      list.appendChild(cardEl(c));
    }
    if (col.create) {
      const add = document.createElement('button');
      add.className = 'add'; add.textContent = '+ novo card';
      add.onclick = createCard;
      list.appendChild(add);
    }

    el.addEventListener('dragover', (ev) => { ev.preventDefault(); el.classList.add('drop'); });
    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', (ev) => {
      ev.preventDefault(); el.classList.remove('drop');
      const id = ev.dataTransfer.getData('text/plain');
      move(id, col.id);
    });
    board.appendChild(el);
  }
}

function cardEl(c) {
  const st = BOARD.statuses[c.status] || { label: c.status, color: '#64748b' };
  const el = document.createElement('div');
  el.className = 'card' + (c.id === selectedId ? ' selected' : '');
  el.draggable = true;
  const meta = [c.jira || c.plan, c.progress && c.progress.total ? `${c.progress.done}/${c.progress.total}` : null].filter(Boolean).join(' · ');
  el.innerHTML = `<div class="name">${c.name}</div>
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    <div class="row">
      <span class="badge" style="background:${st.color}22;color:${st.color}">${st.label}</span>
      <button class="open">terminal ⇱</button>
    </div>`;
  el.addEventListener('dragstart', (ev) => ev.dataTransfer.setData('text/plain', c.id));
  el.addEventListener('click', (ev) => { if (ev.target.closest('.open')) return; selectedId = c.id; render(); });
  const btn = el.querySelector('.open');
  btn.onclick = (ev) => { ev.stopPropagation(); open(c.id, btn); };
  return el;
}

async function createCard() {
  const name = prompt('Nome do card:');
  if (!name) return;
  await fetch('/api/card', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
}
async function move(id, column) {
  const r = await (await fetch('/api/move', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, column }) })).json();
  if (r.error) alert(r.error); // guard bloqueou (fase anterior não concluída)
}
async function del(id) {
  await fetch('/api/delete', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }) });
  // a remoção da UI vem pelo evento SSE 'delete'
}
async function open(id, btn) {
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = 'abrindo…'; }
  try {
    const r = await (await fetch('/api/open', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }) })).json();
    if (r.error) alert(r.error);
  } finally {
    if (btn) setTimeout(() => { btn.disabled = false; btn.textContent = 'terminal ⇱'; }, 3000);
  }
}

boot();
</script>
</body>
</html>
